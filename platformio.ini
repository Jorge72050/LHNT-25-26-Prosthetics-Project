; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

;[env:esp32-c6-devkitc-1]
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
;platform = espressif32
;board = esp32-c6-devkitc-1
;framework = arduino
;lib_deps =
;    ESP32Servo
;    arduino-libraries/Servo@^1.2.2
;    arduino-libraries/Stepper@^1.1.3
;    andrealombardo/L298N@^2.0.3
;    Arduino

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    ESP32Servo
    ;arduino-libraries/Servo@^1.2.2
    arduino-libraries/Stepper@^1.1.3
    ; change depending on DC motor we have
    andrealombardo/L298N@^2.0.3

;build_src_filter = +<*> -<encoder_read.cpp> -<pwm_speed.cpp> -<motor_test.cpp>
build_src_filter = -<*> +<motor.cpp>

monitor_speed = 115200
[env:encoder_read]
extends = env:esp32dev
build_src_filter = -<*> +<encoder_read.cpp>
monitor_speed = 115200

[env:pwm_speed]
extends = env:esp32dev
build_src_filter = -<*> +<pwm_speed.cpp>
monitor_speed = 115200

[env:motor_test]
extends = env:esp32dev
build_src_filter = -<*> +<motor_test.cpp>

[env:driver_test]
extends = env:esp32dev
build_src_filter = -<*> +<drivertest.cpp>
monitor_speed = 115200